name: Benaiah Desktop Windows Release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or tag to package
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: Install npm 12
        run: npm i -g npm@12

      - name: Install dependencies
        run: npm ci

      - name: Build renderer and Electron shell
        run: npm run --workspace apps/desktop build

      - name: Package branded x64 installer
        run: npm run --workspace apps/desktop builder -- --win nsis --x64

      - name: Upload installer and update feed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benaiah-desktop-windows
          if-no-files-found: error
          path: |
            apps/desktop/release/Benaiah-*-win-x64.exe
            apps/desktop/release/Benaiah-*-win-x64.exe.blockmap
            apps/desktop/release/latest.yml
